name: imageio-d checks

on:
  push:
  pull_request:

jobs:
  dmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          git clone --depth 1 https://github.com/alex-1974/error-d.git ../error-d
          git clone --depth 1 https://github.com/alex-1974/raster-d.git ../raster-d
          mkdir -p ../../../
          # imageio-d's JPEG metadata contract is currently provided by this
          # research commit; master does not yet export those symbols.
          git clone --depth 1 --branch codex/fix-dip1000-bitwriter https://github.com/alex-1974/compression-d.git ../../../compression-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Run imageio checks
        run: ./check.sh

  ldc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          git clone --depth 1 https://github.com/alex-1974/error-d.git ../error-d
          git clone --depth 1 https://github.com/alex-1974/raster-d.git ../raster-d
          mkdir -p ../../../
          # Keep the dependency revision aligned with the JPEG metadata API.
          git clone --depth 1 --branch codex/fix-dip1000-bitwriter https://github.com/alex-1974/compression-d.git ../../../compression-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Run imageio checks
        run: ./check.sh

  public-geotiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          git clone --depth 1 https://github.com/alex-1974/error-d.git ../error-d
          git clone --depth 1 https://github.com/alex-1974/raster-d.git ../raster-d
          mkdir -p ../../../
          # Keep the dependency revision aligned with the JPEG metadata API.
          git clone --depth 1 --branch codex/fix-dip1000-bitwriter https://github.com/alex-1974/compression-d.git ../../../compression-d
      - name: Install GeoTIFF fixture tools
        run: sudo apt-get update && sudo apt-get install -y gdal-bin python3-gdal
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Run public GeoTIFF consumer
        run: experiments/public_tiff_consumer/check.sh

  research-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          git clone --depth 1 https://github.com/alex-1974/error-d.git ../error-d
          git clone --depth 1 https://github.com/alex-1974/raster-d.git ../raster-d
          mkdir -p ../../../
          # Keep the dependency revision aligned with the JPEG metadata API.
          git clone --depth 1 --branch codex/fix-dip1000-bitwriter https://github.com/alex-1974/compression-d.git ../../../compression-d
      - name: Install independent GeoTIFF oracle
        run: sudo apt-get update && sudo apt-get install -y gdal-bin python3-gdal python3-pil imagemagick
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Fetch raster-d DUB dependencies
        run: |
          dub fetch mir-core@1.7.4
          dub fetch mir-algorithm@3.22.4
          dub fetch silly@1.1.1
      - name: Run complete local research gate sequence
        run: ./check_all_research_gates.sh
