name: imageio-d checks

on:
  push:
  pull_request:

jobs:
  dmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          mkdir -p ../../../
          git clone --depth 1 https://github.com/alex-1974/compression-d.git ../../../compression-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Run imageio checks
        run: ./check.sh

  ldc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          mkdir -p ../../../
          git clone --depth 1 https://github.com/alex-1974/compression-d.git ../../../compression-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Run imageio checks
        run: ./check.sh

  public-geotiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          mkdir -p ../../../
          git clone --depth 1 https://github.com/alex-1974/compression-d.git ../../../compression-d
      - name: Install GeoTIFF fixture tools
        run: sudo apt-get update && sudo apt-get install -y gdal-bin python3-gdal
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Run public GeoTIFF consumer
        run: experiments/public_tiff_consumer/check.sh

  research-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch workspace dependencies
        run: |
          git clone --depth 1 https://github.com/alex-1974/transport-d.git ../transport-d
          git clone --depth 1 https://github.com/alex-1974/containers-d.git ../containers-d
          mkdir -p ../../../
          git clone --depth 1 https://github.com/alex-1974/compression-d.git ../../../compression-d
      - name: Install independent GeoTIFF oracle
        run: sudo apt-get update && sudo apt-get install -y gdal-bin python3-gdal
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Run complete local research gate sequence
        run: ./check_all_research_gates.sh
